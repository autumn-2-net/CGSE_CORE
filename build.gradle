plugins {
    id 'java-library'
}

ext.cgseConfigFile = file('gradle/cgse.properties')
ext.cgseIdentityPaths = ['src/main', 'tools/view/src/main', 'build.gradle', 'settings.gradle',
                         'gradle/engine.gradle', 'gradle/forge.gradle', 'gradle/cgse.properties',
                         'packaging/forge', 'tools/ae-dump/src', 'tools/ae-dump/build.gradle',
                         'tools/ae-dump/settings.gradle', 'tools/ae-dump/gradle.properties', 'LICENSE', 'NOTICE']
ext.cgseLicenseFiles = files('LICENSE', 'NOTICE')
apply from: 'gradle/engine.gradle'
apply from: 'gradle/forge.gradle'

sourceSets {
    // Standalone core checks also use the portable replay/fixture helpers.
    // Keep their compilation scope aligned with tests/run.py.
    test.java.setSrcDirs(['tests/core/java', 'tests/shared/java', 'tests/regression/java', 'tests/corpus/java'])
    view {
        java.srcDir 'tools/view/src/main/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    viewTest {
        java.srcDir 'tests/view/java'
        compileClasspath += sourceSets.main.output + sourceSets.view.output
        runtimeClasspath += sourceSets.main.output + sourceSets.view.output
    }
}

def coreChecks = []
fileTree('tests/core/java').matching { include '**/*.java' }.files.sort().each { source ->
    if (source.name != 'GraphBenchmark.java' && (source.text =~ /public\s+static\s+void\s+main\s*\(/).find()) {
        coreChecks.add(tasks.register('run' + source.name.replace('.java', ''), JavaExec) {
            group = 'verification'
            dependsOn testClasses
            classpath = sourceSets.test.runtimeClasspath
            mainClass = 'org.cgse.core.' + source.name.replace('.java', '')
            jvmArgs '-ea', '-Xmx2g'
            workingDir = layout.buildDirectory.dir('core-tests').get().asFile
            doFirst { workingDir.mkdirs() }
        })
    }
}

tasks.register('coreRegression') {
    group = 'verification'
    description = 'Runs standalone compiler, solver, executor and service regressions.'
    dependsOn coreChecks
}

def viewChecks = []
fileTree('tests/view/java').matching { include '**/*.java' }.files.sort().each { source ->
    if ((source.text =~ /public\s+static\s+void\s+main\s*\(/).find()) {
        viewChecks.add(tasks.register('runView' + source.name.replace('.java', ''), JavaExec) {
            group = 'verification'
            dependsOn viewTestClasses
            classpath = sourceSets.viewTest.runtimeClasspath
            mainClass = 'org.cgse.view.' + source.name.replace('.java', '')
            jvmArgs '-ea', '-Djava.awt.headless=true'
        })
    }
}

tasks.register('viewRegression') {
    group = 'verification'
    dependsOn viewChecks
}

tasks.register('viewJar', Jar) {
    dependsOn viewClasses
    archiveClassifier = 'view'
    from sourceSets.view.output
}

check.dependsOn coreRegression, viewRegression
assemble.dependsOn viewJar
