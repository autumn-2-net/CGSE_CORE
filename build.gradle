import java.security.MessageDigest

plugins {
    id 'java-library'
}

group = 'org.cgse'
version = '0.1.0-SNAPSHOT'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

// Archive builds must not accidentally inherit a surrounding checkout's HEAD.
def readGit = { List<String> arguments ->
    try {
        def output = providers.exec {
            workingDir rootDir
            commandLine(['git'] + arguments)
            ignoreExitValue = true
        }
        return output.result.get().exitValue == 0 ? output.standardOutput.asText.get().trim() : null
    } catch (Exception ignored) {
        return null
    }
}
def identityPaths = ['src/main', 'tools/view/src/main', 'build.gradle', 'settings.gradle', 'LICENSE', 'NOTICE']
def buildIdentity = providers.provider {
    def top = readGit(['rev-parse', '--show-toplevel'])
    def ownCheckout = top != null && file(top).canonicalFile == rootDir.canonicalFile
    def revision = ownCheckout ? readGit(['rev-parse', 'HEAD']) : null
    def changes = ownCheckout ? readGit(['status', '--porcelain', '--untracked-files=all', '--'] + identityPaths) : null
    def digest = MessageDigest.getInstance('SHA-256')
    def sources = files(identityPaths.collect { path -> file(path).isDirectory() ? fileTree(path) : file(path) })
    sources.files.findAll { it.isFile() }.sort { relativePath(it) }.each { source ->
        digest.update(relativePath(source).replace('\\', '/').getBytes('UTF-8'))
        digest.update((byte) 0)
        digest.update(source.getText('UTF-8').replace('\r\n', '\n').getBytes('UTF-8'))
        digest.update((byte) 0)
    }
    ['Implementation-Revision': revision ?: 'unknown',
     'Implementation-Source-Dirty': changes == null ? 'unknown' : Boolean.toString(!changes.isEmpty()),
     'Implementation-Source-SHA256': digest.digest().encodeHex().toString()]
}

tasks.withType(Jar).configureEach {
    from(rootProject.files('LICENSE', 'NOTICE')) { into 'META-INF' }
    manifest.attributes('Bundle-License': 'https://mozilla.org/MPL/2.0/',
            'Implementation-URL': 'https://github.com/autumn-2-net/CGSE_CORE')
    inputs.property('cgseBuildIdentity', buildIdentity)
    doFirst { manifest.attributes(buildIdentity.get()) }
}

sourceSets {
    // Standalone core checks also use the portable replay/fixture helpers.
    // Keep their compilation scope aligned with tests/run.py.
    test.java.setSrcDirs(['tests/core/java', 'tests/shared/java', 'tests/regression/java', 'tests/corpus/java'])
    view {
        java.srcDir 'tools/view/src/main/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    viewTest {
        java.srcDir 'tests/view/java'
        compileClasspath += sourceSets.main.output + sourceSets.view.output
        runtimeClasspath += sourceSets.main.output + sourceSets.view.output
    }
}

def coreChecks = []
fileTree('tests/core/java').matching { include '**/*.java' }.files.sort().each { source ->
    if (source.name != 'GraphBenchmark.java' && (source.text =~ /public\s+static\s+void\s+main\s*\(/).find()) {
        coreChecks.add(tasks.register('run' + source.name.replace('.java', ''), JavaExec) {
            group = 'verification'
            dependsOn testClasses
            classpath = sourceSets.test.runtimeClasspath
            mainClass = 'org.cgse.core.' + source.name.replace('.java', '')
            jvmArgs '-ea', '-Xmx2g'
            workingDir = layout.buildDirectory.dir('core-tests').get().asFile
            doFirst { workingDir.mkdirs() }
        })
    }
}

tasks.register('coreRegression') {
    group = 'verification'
    description = 'Runs standalone compiler, solver, executor and service regressions.'
    dependsOn coreChecks
}

def viewChecks = []
fileTree('tests/view/java').matching { include '**/*.java' }.files.sort().each { source ->
    if ((source.text =~ /public\s+static\s+void\s+main\s*\(/).find()) {
        viewChecks.add(tasks.register('runView' + source.name.replace('.java', ''), JavaExec) {
            group = 'verification'
            dependsOn viewTestClasses
            classpath = sourceSets.viewTest.runtimeClasspath
            mainClass = 'org.cgse.view.' + source.name.replace('.java', '')
            jvmArgs '-ea', '-Djava.awt.headless=true'
        })
    }
}

tasks.register('viewRegression') {
    group = 'verification'
    dependsOn viewChecks
}

tasks.register('viewJar', Jar) {
    dependsOn viewClasses
    archiveClassifier = 'view'
    from sourceSets.view.output
}

check.dependsOn coreRegression, viewRegression
assemble.dependsOn viewJar

jar {
    manifest.attributes('Implementation-Title': 'Compiled Graph Solving Engine',
            'Implementation-Version': project.version)
}
